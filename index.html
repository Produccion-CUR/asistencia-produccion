function fechaLocalISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dia}`;
}
const today = () => fechaLocalISO(new Date());
function fmtFecha(iso) { if (!iso) return "—"; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; }
function fmtHoy() { return new Date().toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long" }); }
function iniciales(nombre = "") { return nombre.split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase(); }
function nombreCompleto(c) { return [c.nombre, c.apellidoPaterno, c.apellidoMaterno].filter(Boolean).join(" "); }
function diasAtras(n) { const d = new Date(); d.setDate(d.getDate() - n); return fechaLocalISO(d); }
function normalizarRut(rut) { return String(rut || "").trim().toUpperCase().replace(/\./g, "").replace(/\s+/g, ""); }

function normalizarRolImportado(cargoRaw) {
  if (!cargoRaw) return "Operario de Packing";
  const v = String(cargoRaw).trim().toUpperCase();
  if (v.includes("MOVILIZ")) return "Movilizador";
  if (v.includes("PACKING")) return "Operario de Packing";
  if (v.includes("TUNELERO")) return "Tunelero";
  if (v.includes("MAQUINA") || v.includes("MÁQUINA")) return "Operador de Máquina";
  if (v.includes("JEFE") && v.includes("LINEA")) return "Jefe de Línea";
  if (v.includes("SAP")) return "Control Información SAP";
  if (v.includes("SUPERVISOR") && (v.includes("GESTION") || v.includes("GESTIÓN"))) return "Supervisor Gestión";
  if (v.includes("SUPERVISOR")) return "Supervisor Producción";
  // Si ya viene exactamente en la lista válida, se respeta tal cual.
  const exacto = ROLES.find(r => r.toUpperCase() === v);
  if (exacto) return exacto;
  return "Operario de Packing";
}

function normalizarEstadoLaboralImportado(valorRaw) {
  if (!valorRaw) return "activo";
  const v = String(valorRaw).trim().toUpperCase();
  if (v.includes("NO VOLVER")) return "prohibido";
  if (v.includes("VOLVER A LLAMAR")) return "volver_a_llamar";
  const exacto = OPCIONES_JEFE.find(o => o.key === valorRaw || o.label.toUpperCase() === v);
  if (exacto) return exacto.key;
  return "activo";
}

// Parser CSV simple (soporta comillas dobles para campos con comas)
function parseCSV(texto) {
  // Quita el BOM de codificación que agregan algunos programas (como Excel)
  // al guardar como CSV; si no se limpia, queda pegado al primer encabezado.
  if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);

  const lineas = texto.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lineas.length < 2) return [];

  // Detecta si el archivo usa "," o ";" como separador (Excel en español suele
  // exportar con ";"). Se decide mirando cuál aparece más veces en la primera línea.
  const comas = (lineas[0].match(/,/g) || []).length;
  const puntoYComa = (lineas[0].match(/;/g) || []).length;
  const separador = puntoYComa > comas ? ";" : ",";

  function parseLinea(linea) {
    const campos = [];
    let actual = "";
    let entreComillas = false;
    for (let i = 0; i < linea.length; i++) {
      const ch = linea[i];
      if (ch === '"') { entreComillas = !entreComillas; }
      else if (ch === separador && !entreComillas) { campos.push(actual.trim()); actual = ""; }
      else { actual += ch; }
    }
    campos.push(actual.trim());
    return campos;
  }
  const headers = parseLinea(lineas[0]).map(h => h.toLowerCase());
  return lineas.slice(1).map(linea => {
    const valores = parseLinea(linea);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (valores[i] || "").trim(); });
    return obj;
  });
}

// CONFIGURACIÓN DEL BACKEND (Google Apps Script + Google Sheets)
// ---------------------------------------------------------------------------
// Pega aquí la URL de tu deployment de Apps Script (termina en /exec).
// Ver apps_script_backend.gs para el código que va en el lado de Google Sheets.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCsIP5OlnsCUmqmIr3rZRFRj8p_zKwYhgv-nSV_KYCSox-BloAbVLI4ffKEOanzG-raA/exec";

const INTERVALO_SINCRONIZACION_MS = 12000; // cada cuánto revisa cambios de otros dispositivos

// Apps Script no maneja bien ejecuciones simultáneas: si varios datasets piden
// datos al mismo tiempo, algunas solicitudes fallan o se demoran de más.
// Esta cola asegura que todas las llamadas al backend se hagan una por una.
let __colaBackend = Promise.resolve();
function encolarBackend(fn) {
  const resultado = __colaBackend.then(fn, fn);
  __colaBackend = resultado.then(() => {}, () => {});
  return resultado;
}

async function backendGet(key) {
  return encolarBackend(async () => {
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  });
}

async function backendSet(key, value) {
  return encolarBackend(async () => {
    // Content-Type "text/plain" evita el preflight CORS que Apps Script no maneja bien.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ modo: "reemplazar", key, value }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  });
}

// Actualiza/agrega SOLO los items indicados (identificados por claveCampo,
// normalmente "id"), sin reescribir el resto de la hoja. Mucho más rápido
// que backendSet cuando solo cambia 1 o pocas filas.
async function backendUpsert(key, items, claveCampo = "id") {
  return encolarBackend(async () => {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ modo: "upsert", key, items, claveCampo }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  });
}

// Agrega filas nuevas al final de la hoja, sin tocar las existentes.
// Pensado para historiales que solo crecen (nunca se editan hacia atrás).
async function backendAgregar(key, items) {
  return encolarBackend(async () => {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ modo: "agregar", key, items }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  });
}

// Ejecuta varias operaciones ({modo, key, items|value, claveCampo}) en UNA sola
// solicitud de red (una sola vuelta al servidor), en vez de una por operación.
// Ideal cuando una acción del usuario toca más de un dataset a la vez
// (ej: cambiar estado = actualizar colaboradores + agregar al historial).
async function backendLote(operaciones) {
  return encolarBackend(async () => {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ modo: "lote", operaciones }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  });
}

function useSharedList(key) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const ultimoValorCrudo = useRef(null);

  const cargar = useCallback(async (mostrarLoading) => {
    if (mostrarLoading) setLoading(true);
    try {
      const data = await backendGet(key);
      if (data?.value && data.value !== ultimoValorCrudo.current) {
        ultimoValorCrudo.current = data.value;
        setItems(JSON.parse(data.value));
      }
      setError(null);
    } catch (e) {
      setError(`No se pudo conectar con la base de datos: ${e?.message}`);
    }
    if (mostrarLoading) setLoading(false);
  }, [key]);

  useEffect(() => {
    cargar(true);
    const intervalo = setInterval(() => cargar(false), INTERVALO_SINCRONIZACION_MS);
    return () => clearInterval(intervalo);
  }, [cargar]);

  const save = useCallback(async (newItems) => {
    setItems(newItems);
    const crudo = JSON.stringify(newItems);
    ultimoValorCrudo.current = crudo;
    try {
      const data = await backendSet(key, crudo);
      if (!data?.ok) { setError("No se pudo guardar."); return false; }
      setError(null);
      return true;
    } catch (e) { setError(`Error: ${e?.message}`); return false; }
  }, [key]);

  // Actualiza/agrega solo `itemsModificados` (por claveCampo, normalmente "id")
  // dentro de `newItemsCompleto` (el array completo ya actualizado localmente).
  // Solo esos items viajan por red — mucho más rápido que `save` para
  // ediciones pequeñas sobre listas grandes.
  const saveUpsert = useCallback(async (newItemsCompleto, itemsModificados, claveCampo = "id") => {
    setItems(newItemsCompleto);
    ultimoValorCrudo.current = JSON.stringify(newItemsCompleto);
    try {
      const data = await backendUpsert(key, itemsModificados, claveCampo);
      if (!data?.ok) { setError("No se pudo guardar."); return false; }
      setError(null);
      return true;
    } catch (e) { setError(`Error: ${e?.message}`); return false; }
  }, [key]);

  // Agrega `itemsNuevos` al final (para historiales que solo crecen).
  // `newItemsCompleto` es el array completo ya actualizado localmente.
  const saveAgregar = useCallback(async (newItemsCompleto, itemsNuevos) => {
    setItems(newItemsCompleto);
    ultimoValorCrudo.current = JSON.stringify(newItemsCompleto);
    try {
      const data = await backendAgregar(key, itemsNuevos);
      if (!data?.ok) { setError("No se pudo guardar."); return false; }
      setError(null);
      return true;
    } catch (e) { setError(`Error: ${e?.message}`); return false; }
  }, [key]);

  // Actualiza SOLO el estado local (sin red). Se usa cuando la escritura real
  // se va a mandar combinada con otras en una sola llamada (ver backendLote).
  const setLocal = useCallback((newItemsCompleto) => {
    setItems(newItemsCompleto);
    ultimoValorCrudo.current = JSON.stringify(newItemsCompleto);
  }, []);

  return [items, save, loading, error, saveUpsert, saveAgregar, setLocal];
}

  const t = TURNOS.find(t => t.key === turno);
  if (!t) return null;
  return <span className="text-xs font-medium bg-slate-100 text-slate-600 rounded-full px-2 py-0.5 flex items-center gap-1 shrink-0 w-fit"><t.Icon size={10} />{turno}</span>;
}

function EstadoJefeBadge({ estado }) {
  if (!estado || estado === "activo") return null;
  const opcion = OPCIONES_JEFE.find(o => o.key === estado);
  if (!opcion) return null;
  return <span className={`text-xs rounded-full px-2 py-0.5 font-medium shrink-0 w-fit border ${opcion.light}`}>{opcion.label}</span>;
}

function ToastHost({ toast }) {
  if (!toast) return null;
  return (
    <div className="fixed bottom-6 right-6 z-50 w-full max-w-sm">
      <Toast message={toast.msg} kind={toast.kind} />
    </div>
  );
}

function LoginJefeModal({ onClose, onSuccess }) {
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [error, setError] = useState("");

  function submit() {
    const limpio = pw.trim();
    if (limpio.length === 0) { setError("Ingresa la clave de acceso"); return; }
    if (limpio === CLAVE_JEFE) {
      setError("");
      onSuccess();
    } else {
      setError("Clave incorrecta. Inténtalo de nuevo.");
      setPw("");
    }
  }

  function handleKeyDown(e) {
    if (e.key === "Enter") submit();
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-xl">
        <div className="flex items-center justify-between">
          <h2 className="font-semibold text-slate-900 flex items-center gap-2"><Lock size={18} /> Modo Jefe</h2>
          <button type="button" onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100"><XIcon size={18} /></button>
        </div>
        <div>
          <div className="relative">
            <input
              autoFocus
              type={show ? "text" : "password"}
              value={pw}
              onChange={e => { setPw(e.target.value); if (error) setError(""); }}
              onKeyDown={handleKeyDown}
              placeholder="Clave de acceso"
              className={inputBase + " pr-10" + (error ? " ring-2 ring-red-300 border-red-300" : "")}
            />
            <button type="button" onClick={() => setShow(s => !s)} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400">
              {show ? <EyeOff size={16} /> : <Eye size={16} />}
            </button>
          </div>
          {error && <p className="text-xs text-red-600 mt-1.5">{error}</p>}
        </div>
        <button type="button" onClick={submit} className="w-full rounded-xl bg-slate-900 text-white py-2.5 text-sm font-medium hover:bg-slate-800">Ingresar</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
function PantallaAsistencia({
  colaboradores, registros, estadoLocal, setEstadoLocal, turnoSel, setTurnoSel,
  fechaSel, setFechaSel, areaFiltro, setAreaFiltro, onGuardar, guardando,
  modoJefe, onIrHistorialPersona, claveTurno,
}) {
  const [filaAbierta, setFilaAbierta] = useState(null);
  const [busqueda, setBusqueda] = useState("");

  const visibles = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    return colaboradores
      .filter(c => !ESTADOS_INACTIVOS.includes(c.estadoJefe))
      .filter(c => c.turnoActual === turnoSel)
      .filter(c => areaFiltro === "Todos" || c.area === areaFiltro)
      .filter(c => !q || nombreCompleto(c).toLowerCase().includes(q) || (c.rut && c.rut.toLowerCase().includes(q)))
      .sort((a, b) => nombreCompleto(a).localeCompare(nombreCompleto(b)));
  }, [colaboradores, turnoSel, areaFiltro, busqueda]);

  function setEstado(colabId, estado) {
    setEstadoLocal(prev => ({ ...prev, [colabId]: { ...prev[colabId], estado } }));
  }
  function setObs(colabId, obs) {
    setEstadoLocal(prev => ({ ...prev, [colabId]: { ...prev[colabId], obs } }));
  }
  function marcarTodos(estado) {
    setEstadoLocal(prev => {
      const next = { ...prev };
      visibles.forEach(c => { next[c.id] = { ...next[c.id], estado }; });
      return next;
    });
  }

  const resumen = ESTADOS_ASIST.map(e => ({
    ...e,
    count: visibles.filter(c => estadoLocal[c.id]?.estado === e.key).length,
  }));
  const sinMarcar = visibles.filter(c => !estadoLocal[c.id]?.estado).length;

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center gap-3 justify-between">
        <div className="flex items-center gap-3 flex-wrap">
          <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-2">
            <CalendarDays size={16} className="text-slate-400" />
            <input type="date" value={fechaSel} onChange={e => setFechaSel(e.target.value)} className="text-sm bg-transparent focus:outline-none" />
            <span className="text-xs text-slate-400 capitalize border-l border-slate-200 pl-2">{fmtHoy()}</span>
          </div>

          <div className="flex bg-white border border-slate-200 rounded-xl p-1 gap-1">
            {TURNOS.map(t => (
              <button
                key={t.key}
                onClick={() => setTurnoSel(t.key)}
                className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition
                  ${turnoSel === t.key ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-100"}`}
              >
                <t.Icon size={14} /> {t.label}
              </button>
            ))}
          </div>

          <div className="flex gap-1.5">
            {["Todos", ...AREAS].map(a => (
              <button
                key={a}
                onClick={() => setAreaFiltro(a)}
                className={`rounded-full px-3 py-1.5 text-xs font-medium border transition
                  ${areaFiltro === a ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-200 hover:bg-slate-50"}`}
              >
                {a}
              </button>
            ))}
          </div>

          <input
            value={busqueda}
            onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar por RUT o nombre..."
            className={inputBase + " max-w-xs"}
          />
        </div>

        <button
          onClick={onGuardar}
          disabled={guardando || visibles.length === 0}
          className="rounded-xl bg-indigo-600 disabled:opacity-50 text-white px-5 py-2.5 text-sm font-medium flex items-center gap-2 hover:bg-indigo-700"
        >
          {guardando ? <Loader2 size={16} className="animate-spin" /> : <Save size={16} />}
          Guardar asistencia del turno
        </button>
      </div>

      <div className="flex items-center justify-between flex-wrap gap-3">
        <div className="flex gap-2 flex-wrap">
          {resumen.map(r => (
            <span key={r.key} className={`text-xs font-medium rounded-full px-2.5 py-1 ${r.light} ${r.texto}`}>
              {r.label}: {r.count}
            </span>
          ))}
          {sinMarcar > 0 && <span className="text-xs font-medium rounded-full px-2.5 py-1 bg-slate-100 text-slate-500">Sin marcar: {sinMarcar}</span>}
        </div>
        <div className="flex gap-2 items-center">
          <span className="text-xs text-slate-500">Marcar todos:</span>
          {ESTADOS_ASIST.map(e => (
            <button
              key={e.key}
              onClick={() => marcarTodos(e.key)}
              className={`w-8 h-8 rounded-lg ${e.light} ${e.texto} flex items-center justify-center hover:opacity-80`}
              title={e.label}
            >
              <e.Icon size={15} />
            </button>
          ))}
        </div>
      </div>

      <Card className="!p-0 overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-slate-50 border-b border-slate-200 text-left text-xs text-slate-500">
              <th className="px-4 py-3 font-medium">Colaborador</th>
              <th className="px-4 py-3 font-medium">Área / Rol</th>
              <th className="px-4 py-3 font-medium">Casillero</th>
              <th className="px-4 py-3 font-medium text-center">A</th>
              <th className="px-4 py-3 font-medium text-center">F</th>
              <th className="px-4 py-3 font-medium text-center">L</th>
              <th className="px-4 py-3 font-medium text-center">V</th>
              {modoJefe && <th className="px-4 py-3 font-medium">Obs.</th>}
              {modoJefe && <th className="px-4 py-3 font-medium text-center">Turnos</th>}
            </tr>
          </thead>
          <tbody>
            {visibles.map(c => {
              const actual = estadoLocal[c.id] || {};
              const obsCount = registros.filter(r => r.colabId === c.id && r.clave !== claveTurno && r.obs && r.obs.trim()).length;
              const abierta = filaAbierta === c.id;
              return (
                <Fragment key={c.id}>
                  <tr className="border-b border-slate-100 hover:bg-slate-50/60">
                    <td className="px-4 py-3">
                      <div className="flex items-center gap-2.5">
                        <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-[11px] font-semibold shrink-0">
                          {iniciales(nombreCompleto(c))}
                        </div>
                        <div className="min-w-0">
                          <p className="font-medium text-slate-900 leading-tight">{nombreCompleto(c)}</p>
                          {c.rut && <p className="text-[11px] text-slate-400 leading-tight">{c.rut}</p>}
                        </div>
                      </div>
                    </td>
                    <td className="px-4 py-3 text-slate-500">{c.area} · {c.rol}</td>
                    <td className="px-4 py-3 text-slate-500">{c.casillero}</td>
                    {ESTADOS_ASIST.map(e => (
                      <td key={e.key} className="px-4 py-3 text-center">
                        <button
                          onClick={() => setEstado(c.id, e.key)}
                          className={`w-8 h-8 rounded-lg inline-flex items-center justify-center border transition
                            ${actual.estado === e.key ? `${e.bg} text-white border-transparent` : `${e.light} ${e.texto} border-transparent opacity-60 hover:opacity-100`}`}
                          title={e.label}
                        >
                          <e.Icon size={15} />
                        </button>
                      </td>
                    ))}
                    {modoJefe && (
                      <td className="px-4 py-3">
                        <button onClick={() => setFilaAbierta(abierta ? null : c.id)} className="text-slate-400 hover:text-slate-600 flex items-center gap-1 text-xs">
                          {actual.obs ? "Ver nota" : "Agregar"}
                          <span className={`text-[10px] rounded-full px-1.5 ${obsCount >= 3 ? "bg-amber-100 text-amber-700" : "bg-slate-100 text-slate-400"}`}>{obsCount}/3</span>
                          {abierta ? <ChevronDown size={13} /> : <ChevronRight size={13} />}
                        </button>
                      </td>
                    )}
                    {modoJefe && (
                      <td className="px-4 py-3 text-center">
                        <button onClick={() => onIrHistorialPersona(c)} className="p-1.5 rounded-lg hover:bg-slate-100" title="Historial de turnos">
                          <HistoryIcon size={16} className="text-slate-400" />
                        </button>
                      </td>
                    )}
                  </tr>
                  {modoJefe && abierta && (
                    <tr className="border-b border-slate-100 bg-slate-50/40">
                      <td colSpan={9} className="px-4 py-3">
                        {obsCount >= 3 && !actual.obs && (
                          <p className="text-xs text-amber-600 mb-1.5">Esta persona ya tiene 3 observaciones guardadas. Si agregas una nueva, se eliminará la más antigua.</p>
                        )}
                        <textarea
                          value={actual.obs || ""}
                          onChange={ev => setObs(c.id, ev.target.value)}
                          placeholder="Observación (opcional)"
                          rows={2}
                          className={inputBase + " max-w-lg"}
                        />
                      </td>
                    </tr>
                  )}
                </Fragment>
              );
            })}
            {visibles.length === 0 && (
              <tr><td colSpan={modoJefe ? 9 : 7} className="px-4 py-10 text-center text-slate-400">No hay colaboradores en este turno/área.</td></tr>
            )}
          </tbody>
        </table>
      </Card>

      {guardando && <ModalGuardando mensaje="Guardando asistencia del turno..." />}
    </div>
  );
}

function PanelHistorialTurno({ colaborador, colaboradores, saveColaboradores, saveColaboradoresUpsert, setColaboradoresLocal, historial, saveHistorial, saveHistorialAgregar, setHistorialTurnosLocal, onToast, onClose }) {
  const [turnoNuevo, setTurnoNuevo] = useState(colaborador.turnoActual);
  const [motivo, setMotivo] = useState("");
  const [guardando, setGuardando] = useState(false);

  const historialPersona = useMemo(
    () => historial.filter(h => h.colabId === colaborador.id).sort((a, b) => b.fecha.localeCompare(a.fecha)),
    [historial, colaborador.id]
  );

  async function registrarCambio() {
    if (turnoNuevo === colaborador.turnoActual) { onToast("Selecciona un turno distinto al actual", "error"); return; }
    if (motivo.trim().length === 0) { onToast("Agrega una observación para el cambio de turno", "error"); return; }
    setGuardando(true);

    const nuevoRegistro = {
      id: Date.now(),
      colabId: colaborador.id,
      turnoAnterior: colaborador.turnoActual,
      turnoNuevo,
      fecha: today(),
      motivo: motivo.trim(),
    };
    const colaboradorActualizado = { ...colaborador, turnoActual: turnoNuevo };
    const nuevosColab = colaboradores.map(c => c.id === colaborador.id ? colaboradorActualizado : c);
    const nuevoHistorialCompleto = [nuevoRegistro, ...historial];

    setColaboradoresLocal(nuevosColab);
    setHistorialTurnosLocal(nuevoHistorialCompleto);

    let ok = false;
    try {
      const data = await backendLote([
        { modo: "upsert", key: "asist-colaboradores", items: [colaboradorActualizado], claveCampo: "id" },
        { modo: "agregar", key: "asist-turnos-historial", items: [nuevoRegistro] },
      ]);
      ok = !!data?.ok;
    } catch (e) { ok = false; }

    setGuardando(false);
    if (ok) {
      setMotivo("");
      onToast("Cambio de turno registrado", "ok");
    } else {
      onToast("Error al registrar el cambio", "error");
    }
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-end" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-slate-50 h-screen w-full max-w-md p-6 space-y-5 overflow-y-auto shadow-xl">
        <div className="flex items-center justify-between">
          <h2 className="font-semibold text-slate-900">Historial de turnos</h2>
          <button onClick={onClose} className="p-1.5 rounded-lg hover:bg-slate-200"><XIcon size={18} /></button>
        </div>

        <Card>
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-semibold">
              {iniciales(nombreCompleto(colaborador))}
            </div>
            <div>
              <p className="font-medium text-slate-900">{nombreCompleto(colaborador)}</p>
              <p className="text-xs text-slate-500">{colaborador.rol} · {colaborador.area}</p>
            </div>
          </div>
        </Card>

        <Card className="space-y-3">
          <p className="text-sm font-medium text-slate-900">Registrar cambio de turno</p>
          <div className="flex items-center gap-2 text-sm">
            <TurnoChip turno={colaborador.turnoActual} />
            <ArrowLeft size={14} className="rotate-180 text-slate-400" />
            <select value={turnoNuevo} onChange={e => setTurnoNuevo(e.target.value)} className={inputBase + " w-auto"}>
              {TURNOS.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
            </select>
          </div>
          <div>
            <textarea
              value={motivo}
              onChange={e => setMotivo(e.target.value)}
              placeholder="Observación del cambio (obligatoria)"
              rows={2}
              className={inputBase}
            />
            <p className="text-xs text-slate-400 mt-1">Debes indicar el motivo del cambio de turno.</p>
          </div>
          <button
            onClick={registrarCambio}
            disabled={guardando}
            className="w-full rounded-xl bg-slate-900 text-white py-2.5 text-sm font-medium flex items-center justify-center gap-2 disabled:opacity-50 hover:bg-slate-800"
          >
            {guardando ? <Loader2 size={16} className="animate-spin" /> : <Check size={16} />}
            Confirmar cambio
          </button>
        </Card>

        <div>
          <p className="text-sm font-medium text-slate-900 mb-2 px-1">Historial</p>
          {historialPersona.length === 0 && <p className="text-sm text-slate-400 px-1">Sin cambios registrados.</p>}
          <div className="space-y-2">
            {historialPersona.map(h => (
              <Card key={h.id} className="!p-3">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2 text-sm">
                    <TurnoChip turno={h.turnoAnterior} />
                    <ArrowLeft size={12} className="rotate-180 text-slate-400" />
                    <TurnoChip turno={h.turnoNuevo} />
                  </div>
                  <span className="text-xs text-slate-400">{fmtFecha(h.fecha)}</span>
                </div>
                {h.motivo && <p className="text-xs text-slate-500 mt-1.5">{h.motivo}</p>}
              </Card>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function PantallaIndicadores({ colaboradores, registros }) {
  const [periodo, setPeriodo] = useState(30);
  const [fechaInicioCustom, setFechaInicioCustom] = useState(diasAtras(30));
  const [fechaFinCustom, setFechaFinCustom] = useState(today());

  const { fechaInicio, fechaFin } = useMemo(() => {
    if (periodo === "custom") return { fechaInicio: fechaInicioCustom, fechaFin: fechaFinCustom };
    return { fechaInicio: diasAtras(periodo), fechaFin: today() };
  }, [periodo, fechaInicioCustom, fechaFinCustom]);

  const registrosPeriodo = useMemo(
    () => registros.filter(r => r.fecha >= fechaInicio && r.fecha <= fechaFin),
    [registros, fechaInicio, fechaFin]
  );

  const ranking = useMemo(() => {
    return colaboradores
      .map(c => {
        const regs = registrosPeriodo.filter(r => r.colabId === c.id);
        const faltas = regs.filter(r => r.estado === "F").length;
        const total = regs.length;
        return { ...c, faltas, total, pct: total ? Math.round((faltas / total) * 100) : 0 };
      })
      .filter(c => c.faltas > 0)
      .sort((a, b) => b.faltas - a.faltas || b.pct - a.pct);
  }, [colaboradores, registrosPeriodo]);

  const statsPersona = useMemo(() => {
    return colaboradores.map(c => {
      const regs = registrosPeriodo.filter(r => r.colabId === c.id);
      return {
        ...c,
        faltas: regs.filter(r => r.estado === "F").length,
        licencias: regs.filter(r => r.estado === "L").length,
        observaciones: regs.filter(r => r.obs && r.obs.trim()).length,
      };
    });
  }, [colaboradores, registrosPeriodo]);

  const top5Faltas = useMemo(
    () => [...statsPersona].filter(c => c.faltas > 0).sort((a, b) => b.faltas - a.faltas).slice(0, 5),
    [statsPersona]
  );
  const top5Licencias = useMemo(
    () => [...statsPersona].filter(c => c.licencias > 0).sort((a, b) => b.licencias - a.licencias).slice(0, 5),
    [statsPersona]
  );
  const top5Observaciones = useMemo(
    () => [...statsPersona].filter(c => c.observaciones > 0).sort((a, b) => b.observaciones - a.observaciones).slice(0, 5),
    [statsPersona]
  );

  // Conteo A/F/L/V para un conjunto de registros
  function contar(regs) {
    const c = { A: 0, F: 0, L: 0, V: 0 };
    regs.forEach(r => { if (c[r.estado] !== undefined) c[r.estado]++; });
    const total = regs.length;
    const pctFalta = total ? Math.round((c.F / total) * 100) : 0;
    return { ...c, total, pctFalta };
  }

  const porArea = useMemo(() => {
    return AREAS.map(area => {
      const regsArea = registrosPeriodo.filter(r => {
        const c = colaboradores.find(c => c.id === r.colabId);
        return c?.area === area;
      });
      return { area, ...contar(regsArea) };
    });
  }, [colaboradores, registrosPeriodo]);

  const porTurno = useMemo(() => {
    return TURNOS.map(t => {
      const regsTurno = registrosPeriodo.filter(r => r.turno === t.key);
      return { turno: t, ...contar(regsTurno) };

function ModalNuevoColaborador({ colaboradores, saveColaboradores, onToast, onClose }) {
  const [form, setForm] = useState({
    rut: "", nombre: "", apellidoPaterno: "", apellidoMaterno: "",
    area: AREAS[0], rol: ROLES[0], turnoActual: "T1", estadoJefe: "activo", casillero: "",
  });
  const [guardando, setGuardando] = useState(false);

  function set(campo, valor) {
    setForm(f => ({ ...f, [campo]: valor }));
  }

  async function guardar() {
    if (!form.nombre.trim() || !form.apellidoPaterno.trim()) {
      onToast("Nombre y apellido paterno son obligatorios", "error");
      return;
    }
    const rutNormalizado = normalizarRut(form.rut);
    if (rutNormalizado && colaboradores.some(c => normalizarRut(c.rut) === rutNormalizado)) {
      onToast("Ya existe un colaborador con ese RUT", "error");
      return;
    }
    setGuardando(true);
    const nuevoId = colaboradores.reduce((max, c) => Math.max(max, c.id), 0) + 1;
    const nuevo = {
      id: nuevoId,
      rut: rutNormalizado,
      nombre: form.nombre.trim(),
      apellidoPaterno: form.apellidoPaterno.trim(),
      apellidoMaterno: form.apellidoMaterno.trim(),
      area: form.area,
      rol: form.rol,
      turnoActual: form.turnoActual,
      estadoJefe: form.estadoJefe,
      casillero: form.casillero.trim(),
    };
    const ok = await saveColaboradores([...colaboradores, nuevo]);
    setGuardando(false);
    onToast(ok ? `${nombreCompleto(nuevo)} agregado` : "Error al guardar", ok ? "ok" : "error");
    if (ok) onClose();
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl w-full max-w-md p-6 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between">
          <h2 className="font-semibold text-slate-900">Agregar colaborador</h2>
          <button onClick={onClose} className="p-1 rounded-lg hover:bg-slate-100"><XIcon size={18} /></button>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <div className="col-span-2">
            <label className="text-xs text-slate-500 mb-1 block">RUT</label>
            <input value={form.rut} onChange={e => set("rut", e.target.value)} placeholder="12345678-9" className={inputBase} />
          </div>
          <div className="col-span-2">
            <label className="text-xs text-slate-500 mb-1 block">Nombre *</label>
            <input value={form.nombre} onChange={e => set("nombre", e.target.value)} className={inputBase} />
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Apellido paterno *</label>
            <input value={form.apellidoPaterno} onChange={e => set("apellidoPaterno", e.target.value)} className={inputBase} />
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Apellido materno</label>
            <input value={form.apellidoMaterno} onChange={e => set("apellidoMaterno", e.target.value)} className={inputBase} />
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Área</label>
            <select value={form.area} onChange={e => set("area", e.target.value)} className={inputBase}>
              {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Cargo</label>
            <select value={form.rol} onChange={e => set("rol", e.target.value)} className={inputBase}>
              {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Turno</label>
            <select value={form.turnoActual} onChange={e => set("turnoActual", e.target.value)} className={inputBase}>
              {TURNOS.map(t => <option key={t.key} value={t.key}>{t.label}</option>)}
            </select>
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Casillero</label>
            <input value={form.casillero} onChange={e => set("casillero", e.target.value)} className={inputBase} />
          </div>
          <div className="col-span-2">
            <label className="text-xs text-slate-500 mb-1 block">Estado laboral</label>
            <select value={form.estadoJefe} onChange={e => set("estadoJefe", e.target.value)} className={inputBase}>
              {OPCIONES_JEFE.map(o => <option key={o.key} value={o.key}>{o.label}</option>)}
            </select>
          </div>
        </div>

        <button
          onClick={guardar}
          disabled={guardando}
          className="w-full rounded-xl bg-indigo-600 text-white py-2.5 text-sm font-medium disabled:opacity-50 hover:bg-indigo-700 flex items-center justify-center gap-2"
        >
          {guardando ? <Loader2 size={16} className="animate-spin" /> : <Plus size={16} />}
          Agregar colaborador
        </button>
      </div>
    </div>
  );

function PantallaEstadoLaboral({
  colaboradores, saveColaboradores, saveColaboradoresUpsert, setColaboradoresLocal,
  historialEstado, saveHistorialEstado, saveHistorialEstadoAgregar, setHistorialEstadoLocal,
  historialTurnos, saveHistorial, saveHistorialAgregar, setHistorialTurnosLocal,
  notas, saveNotas, onToast, onIrHistorialPersona,
}) {
  const [filtro, setFiltro] = useState("Todos");
  const [busqueda, setBusqueda] = useState("");
  const [editandoCasillero, setEditandoCasillero] = useState(null);
  const [casilleroTmp, setCasilleroTmp] = useState("");
  const [editandoRol, setEditandoRol] = useState(null);
  const [editandoArea, setEditandoArea] = useState(null);
  const [pendingCambio, setPendingCambio] = useState(null); // { colaborador, estadoNuevo }
  const [importando, setImportando] = useState(false);
  const [previewImportacion, setPreviewImportacion] = useState(null);
  const [mostrarNuevoColaborador, setMostrarNuevoColaborador] = useState(false);
  const [seleccionados, setSeleccionados] = useState(new Set());
  const [mostrarCambioLote, setMostrarCambioLote] = useState(false);
  const fileInputRef = useRef(null);

  const lista = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    return colaboradores
      .filter(c => filtro === "Todos" || c.estadoJefe === filtro)
      .filter(c => !q || nombreCompleto(c).toLowerCase().includes(q) || (c.rut && c.rut.toLowerCase().includes(q)))
      .sort((a, b) => nombreCompleto(a).localeCompare(nombreCompleto(b)));
  }, [colaboradores, filtro, busqueda]);

  async function confirmarCambioEstado(comentario) {
    const { colaborador, estadoNuevo } = pendingCambio;
    const colaboradorActualizado = { ...colaborador, estadoJefe: estadoNuevo };
    const nuevosColab = colaboradores.map(c => c.id === colaborador.id ? colaboradorActualizado : c);

    const registro = {
      id: Date.now(),
      colabId: colaborador.id,
      estadoAnterior: colaborador.estadoJefe,
      estadoNuevo,
      fecha: today(),
      comentario,
    };
    const nuevoHistorial = [registro, ...historialEstado];

    // Actualiza la pantalla al instante; la escritura real va combinada en UNA sola llamada de red.
    setColaboradoresLocal(nuevosColab);
    setHistorialEstadoLocal(nuevoHistorial);

    let ok = false;
    try {
      const data = await backendLote([
        { modo: "upsert", key: "asist-colaboradores", items: [colaboradorActualizado], claveCampo: "id" },
        { modo: "agregar", key: "asist-historial-estado", items: [registro] },
      ]);
      ok = !!data?.ok;
    } catch (e) { ok = false; }

    if (ok) {
      const opcionNueva = OPCIONES_JEFE.find(o => o.key === estadoNuevo);
      const seOculta = filtro !== "Todos" && filtro !== estadoNuevo;
      onToast(
        seOculta
          ? `${nombreCompleto(colaborador)} pasó a "${opcionNueva?.label}" — ya no aparece porque el filtro actual es distinto. Cambia a "Todos" para verlo.`
          : `Estado actualizado a "${opcionNueva?.label}"`,
        "ok"
      );
    } else {
      onToast("Error al actualizar", "error");
    }
    setPendingCambio(null);
  }

  function toggleSeleccion(id) {
    setSeleccionados(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  function toggleSeleccionarTodos() {
    setSeleccionados(prev => {
      const todosSeleccionados = lista.length > 0 && lista.every(c => prev.has(c.id));
      if (todosSeleccionados) return new Set();
      return new Set(lista.map(c => c.id));
    });
  }

  async function confirmarCambioLote(tipoCambio, valorNuevo, comentario) {
    const idsSeleccionados = Array.from(seleccionados);
    const colaboradoresSeleccionados = colaboradores.filter(c => idsSeleccionados.includes(c.id));
    let ok = false;

    if (tipoCambio === "estado") {
      const colaboradoresActualizados = colaboradoresSeleccionados.map(c => ({ ...c, estadoJefe: valorNuevo }));
      const nuevosColab = colaboradores.map(c =>
        idsSeleccionados.includes(c.id) ? colaboradoresActualizados.find(a => a.id === c.id) : c
      );
      const nuevosRegistrosHistorial = colaboradoresSeleccionados.map((c, i) => ({
        id: Date.now() + i,
        colabId: c.id,
        estadoAnterior: c.estadoJefe,
        estadoNuevo: valorNuevo,
        fecha: today(),
        comentario,
      }));
      const nuevoHistorialCompleto = [...nuevosRegistrosHistorial, ...historialEstado];

      setColaboradoresLocal(nuevosColab);
      setHistorialEstadoLocal(nuevoHistorialCompleto);
      try {
        const data = await backendLote([
          { modo: "upsert", key: "asist-colaboradores", items: colaboradoresActualizados, claveCampo: "id" },
          { modo: "agregar", key: "asist-historial-estado", items: nuevosRegistrosHistorial },
        ]);
        ok = !!data?.ok;
      } catch (e) { ok = false; }

      const opcionNueva = OPCIONES_JEFE.find(o => o.key === valorNuevo);
      onToast(
        ok
          ? `${colaboradoresSeleccionados.length} colaborador(es) pasaron a "${opcionNueva?.label}"`
          : "Error al actualizar en lote",
        ok ? "ok" : "error"
      );
    } else {
      const colaboradoresActualizados = colaboradoresSeleccionados.map(c => ({ ...c, turnoActual: valorNuevo }));
      const nuevosColab = colaboradores.map(c =>
        idsSeleccionados.includes(c.id) ? colaboradoresActualizados.find(a => a.id === c.id) : c
      );
      const nuevosRegistrosTurno = colaboradoresSeleccionados.map((c, i) => ({
        id: Date.now() + i,
        colabId: c.id,
        turnoAnterior: c.turnoActual,
        turnoNuevo: valorNuevo,
        fecha: today(),
        motivo: comentario,
      }));
      const nuevoHistorialTurnosCompleto = [...nuevosRegistrosTurno, ...historialTurnos];

      setColaboradoresLocal(nuevosColab);
      setHistorialTurnosLocal(nuevoHistorialTurnosCompleto);
      try {
        const data = await backendLote([
          { modo: "upsert", key: "asist-colaboradores", items: colaboradoresActualizados, claveCampo: "id" },
          { modo: "agregar", key: "asist-turnos-historial", items: nuevosRegistrosTurno },
        ]);
        ok = !!data?.ok;
      } catch (e) { ok = false; }

      const turnoLabel = TURNOS.find(t => t.key === valorNuevo)?.label;
      onToast(
        ok
          ? `${colaboradoresSeleccionados.length} colaborador(es) pasaron a "${turnoLabel}"`
          : "Error al actualizar en lote",
        ok ? "ok" : "error"
      );
    }
    setSeleccionados(new Set());
    setMostrarCambioLote(false);
  }

  function descargarPlantilla() {
    const contenido = "rut,nombre,apellido_paterno,apellido_materno,area,rol,turno,casillero,estado_laboral,recomendacion_bd_dotacion\n11222333-4,Juan,Pérez,Soto,Selección,Operario de Packing,T1,C-11,activo,\n22333444-5,María,López,Díaz,Lavado,Movilizador,T2,C-12,desvinculado_temporada,Volver A Llamar\n";
    const blob = new Blob([contenido], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "plantilla_colaboradores.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  function handleArchivoSeleccionado(e) {
    const archivo = e.target.files?.[0];
    if (!archivo) return;
    setImportando(true);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const filas = parseCSV(String(ev.target.result));
        const colabPorRut = new Map(
          colaboradores.filter(c => c.rut).map(c => [normalizarRut(c.rut), c])
        );
        const existentesNombres = new Set(colaboradores.map(c => nombreCompleto(c).trim().toLowerCase()));
        let siguienteId = colaboradores.reduce((max, c) => Math.max(max, c.id), 0) + 1;

        const nuevos = [];
        const actualizables = []; // { existente, actualizado }
        let omitidosPorNombre = 0;

        filas.forEach(fila => {
          const nombre = fila.nombre || fila.name || "";
          if (!nombre) return;
          const apellidoPaterno = fila.apellido_paterno || fila["apellido paterno"] || fila.appaterno || "";
          const apellidoMaterno = fila.apellido_materno || fila["apellido materno"] || fila.apmaterno || "";
          const rut = normalizarRut(fila.rut || fila.run || "");
          const nombreCompletoFila = [nombre, apellidoPaterno, apellidoMaterno].filter(Boolean).join(" ");

          const turnoRaw = (fila.turno || fila.turnoactual || "T1").toUpperCase();
          const turnoActual = TURNOS.some(t => t.key === turnoRaw) ? turnoRaw : "T1";
          const areaRaw = fila.area || AREAS[0];
          const area = AREAS.find(a => a.toLowerCase() === areaRaw.toLowerCase()) || areaRaw;
          const rol = normalizarRolImportado(fila.rol || fila.role || fila.cargo);
          const estadoJefe = normalizarEstadoLaboralImportado(fila.estadolaboral || fila["estado laboral"] || fila.estado_laboral);
          const casillero = fila.casillero || "";
          const recomendacion = (fila.recomendacion_bd_dotacion || fila["recomendacion bd dotacion"] || fila.recomendacion || "").trim();

          const existente = rut ? colabPorRut.get(rut) : null;

          if (existente) {
            const actualizado = { ...existente, nombre, apellidoPaterno, apellidoMaterno, area, rol, turnoActual, estadoJefe, casillero, rut, recomendacion };
            actualizables.push({ existente, actualizado });
            return;
          }

          if (!rut && existentesNombres.has(nombreCompletoFila.trim().toLowerCase())) { omitidosPorNombre++; return; }

          const nuevoId = siguienteId++;
          nuevos.push({ id: nuevoId, rut, nombre, apellidoPaterno, apellidoMaterno, area, rol, turnoActual, estadoJefe, casillero, recomendacion });
          existentesNombres.add(nombreCompletoFila.trim().toLowerCase());
        });

        if (nuevos.length === 0 && actualizables.length === 0) {
          onToast(omitidosPorNombre > 0 ? `No se detectaron filas para importar: ${omitidosPorNombre} omitida(s) por nombre repetido sin RUT` : "El archivo no tiene filas válidas", "error");
        } else {
          setPreviewImportacion({ nuevos, actualizables, omitidosPorNombre, nuevosAplicados: false, actualizadosAplicados: false });
        }
      } catch (err) {
        onToast("No se pudo leer el archivo. Verifica que sea un CSV válido.", "error");
      }
      setImportando(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    };
    reader.readAsText(archivo, "UTF-8");
  }

  async function aplicarNuevos() {
    if (!previewImportacion) return;
    const { nuevos } = previewImportacion;
    const colaboradoresFinal = [...colaboradores, ...nuevos];
    const nuevasNotas = nuevos
      .filter(n => n.recomendacion)
      .map(n => ({ id: Date.now() + n.id, colabId: n.id, fecha: today(), nota: `Recomendación histórica (BD Dotación): ${n.recomendacion}` }));

    const ok = await saveColaboradores(colaboradoresFinal);
    if (nuevasNotas.length > 0) await saveNotas([...notas, ...nuevasNotas]);
    onToast(ok ? `${nuevos.length} colaborador(es) agregado(s)` : "Error al agregar", ok ? "ok" : "error");
    setPreviewImportacion(prev => prev && { ...prev, nuevosAplicados: true });
  }

  async function aplicarActualizacion() {
    if (!previewImportacion) return;
    const { actualizables } = previewImportacion;
    const colaboradoresActualizados = actualizables.map(({ actualizado }) => {
      const { recomendacion, ...limpio } = actualizado;
      return limpio;
    });
    const colaboradoresFinal = colaboradores.map(c => {
      const encontrado = colaboradoresActualizados.find(a => a.id === c.id);
      return encontrado || c;
    });
    const nuevasNotas = actualizables
      .filter(({ actualizado }) => actualizado.recomendacion)
      .map(({ existente, actualizado }) => ({ id: Date.now() + existente.id, colabId: existente.id, fecha: today(), nota: `Recomendación histórica (BD Dotación): ${actualizado.recomendacion}` }))
      .filter(n => !notas.some(existenteNota => existenteNota.colabId === n.colabId && existenteNota.nota === n.nota));

    const ok = await saveColaboradoresUpsert(colaboradoresFinal, colaboradoresActualizados, "id");
    if (nuevasNotas.length > 0) await saveNotas([...notas, ...nuevasNotas]);
    onToast(ok ? `${actualizables.length} colaborador(es) actualizado(s)` : "Error al actualizar", ok ? "ok" : "error");
    setPreviewImportacion(prev => prev && { ...prev, actualizadosAplicados: true });
  }

                <td className="px-4 py-3">
                  <div className="flex gap-1.5 flex-wrap">
                    {OPCIONES_JEFE.map(o => {
                      const activo = c.estadoJefe === o.key;
                      return (
                        <button
                          key={o.key}
                          onClick={() => !activo && setPendingCambio({ colaborador: c, estadoNuevo: o.key })}
                          className={`rounded-lg px-2.5 py-1.5 text-[11px] font-medium border transition
                            ${activo ? `${o.bg} text-white border-transparent` : `${o.light} hover:opacity-80`}`}
                        >
                          {o.label}
                        </button>
                      );
                    })}
                  </div>
                </td>
              </tr>
            ))}
            {lista.length === 0 && (
              <tr><td colSpan={7} className="px-4 py-10 text-center text-slate-400">No hay colaboradores en este estado.</td></tr>
            )}
          </tbody>
        </table>
      </Card>

      {pendingCambio && (
        <ModalComentarioEstado
          colaborador={pendingCambio.colaborador}
          estadoNuevo={pendingCambio.estadoNuevo}
          onClose={() => setPendingCambio(null)}
          onConfirm={confirmarCambioEstado}
        />
      )}

      {mostrarNuevoColaborador && (
        <ModalNuevoColaborador
          colaboradores={colaboradores}
          saveColaboradores={saveColaboradores}
          onToast={onToast}
          onClose={() => setMostrarNuevoColaborador(false)}
        />
      )}

      {mostrarCambioLote && (
        <ModalCambioLote
          colaboradoresSeleccionados={colaboradores.filter(c => seleccionados.has(c.id))}
          onClose={() => setMostrarCambioLote(false)}
          onConfirm={confirmarCambioLote}
        />
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// PANTALLA: HISTORIAL POR PERSONA (solo modo jefe)
// ---------------------------------------------------------------------------
function PantallaHistorialPorPersona({ colaboradores, registros, historialTurnos, historialEstado, notas }) {
  const [busqueda, setBusqueda] = useState("");
  const [seleccionadoId, setSeleccionadoId] = useState(colaboradores[0]?.id ?? null);

  const listaFiltrada = useMemo(() => {
    return colaboradores
      .filter(c => {
        const q = busqueda.toLowerCase();
        return nombreCompleto(c).toLowerCase().includes(q) || (c.rut && c.rut.toLowerCase().includes(q));
      })
      .sort((a, b) => nombreCompleto(a).localeCompare(nombreCompleto(b)));
  }, [colaboradores, busqueda]);

  const seleccionado = colaboradores.find(c => c.id === seleccionadoId) || null;

  const timeline = useMemo(() => {
    if (!seleccionado) return [];
    const eventos = [];

    registros.filter(r => r.colabId === seleccionado.id).forEach(r => {
      const e = ESTADO_MAP[r.estado];
      eventos.push({
        tipo: "asistencia",
        fecha: r.fecha,
        orden: 1,
        icon: e?.Icon || CheckCircle2,
        color: e?.texto || "text-slate-600",
        bg: e?.light || "bg-slate-100",
        titulo: `${e?.label || r.estado} · ${r.turno}`,
        detalle: r.obs || null,
      });
    });

    historialTurnos.filter(h => h.colabId === seleccionado.id).forEach(h => {
      eventos.push({
        tipo: "turno",
        fecha: h.fecha,
        orden: 2,
        icon: HistoryIcon,
        color: "text-indigo-600",
        bg: "bg-indigo-100",
        titulo: `Cambio de turno: ${h.turnoAnterior} → ${h.turnoNuevo}`,
        detalle: h.motivo || null,
      });
    });

    historialEstado.filter(h => h.colabId === seleccionado.id).forEach(h => {
      const opNuevo = OPCIONES_JEFE.find(o => o.key === h.estadoNuevo);
      const opAnterior = OPCIONES_JEFE.find(o => o.key === h.estadoAnterior);
      eventos.push({
        tipo: "estado",
        fecha: h.fecha,
        orden: 2,
        icon: Flag,
        color: "text-orange-600",
        bg: "bg-orange-100",
        titulo: `Estado laboral: ${opAnterior?.label || h.estadoAnterior} → ${opNuevo?.label || h.estadoNuevo}`,
        detalle: h.comentario || null,
      });
    });

    (notas || []).filter(n => n.colabId === seleccionado.id).forEach(n => {
      eventos.push({
        tipo: "nota",
        fecha: n.fecha,
        orden: 0,
        icon: Pencil,
        color: "text-slate-500",
        bg: "bg-slate-100",
        titulo: "Nota",
        detalle: n.nota || null,
      });
    });

    return eventos.sort((a, b) => b.fecha.localeCompare(a.fecha) || b.orden - a.orden);
  }, [seleccionado, registros, historialTurnos, historialEstado, notas]);

  const resumenAsistencia = useMemo(() => {
    if (!seleccionado) return null;
    const regs = registros.filter(r => r.colabId === seleccionado.id);
    const c = { A: 0, F: 0, L: 0, V: 0 };
    regs.forEach(r => { if (c[r.estado] !== undefined) c[r.estado]++; });
    return { ...c, total: regs.length };
  }, [seleccionado, registros]);

  return (
    <div className="flex gap-5" style={{ minHeight: "70vh" }}>
      {/* Lista de colaboradores */}
      <Card className="!p-0 w-72 shrink-0 overflow-hidden flex flex-col">
        <div className="p-3 border-b border-slate-100">
          <input
            value={busqueda}
            onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar por nombre o RUT..."
            className={inputBase}
          />
        </div>
        <div className="overflow-y-auto flex-1">
          {listaFiltrada.map(c => (
            <button
              key={c.id}
              onClick={() => setSeleccionadoId(c.id)}
              className={`w-full flex items-center gap-2.5 px-3 py-2.5 text-left border-b border-slate-50
                ${seleccionadoId === c.id ? "bg-indigo-50" : "hover:bg-slate-50"}`}
            >
              <div className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-[11px] font-semibold shrink-0">
                {iniciales(nombreCompleto(c))}
              </div>
              <div className="min-w-0">
                <p className="text-sm font-medium text-slate-900 truncate">{nombreCompleto(c)}</p>
                <p className="text-xs text-slate-500 truncate">{c.area}{c.rut ? ` · ${c.rut}` : ""}</p>
              </div>
            </button>
          ))}
          {listaFiltrada.length === 0 && <p className="text-sm text-slate-400 text-center py-8">Sin resultados.</p>}
        </div>
      </Card>

      {/* Detalle de la persona */}
      <div className="flex-1 min-w-0 space-y-5">
        {!seleccionado ? (
          <Card><p className="text-sm text-slate-400 text-center py-10">Selecciona un colaborador.</p></Card>
        ) : (
          <React.Fragment>
            <Card>
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-semibold shrink-0">
                  {iniciales(nombreCompleto(seleccionado))}
                </div>
                <div className="min-w-0 flex-1">
                  <p className="font-semibold text-slate-900">{nombreCompleto(seleccionado)}</p>
                  <p className="text-xs text-slate-500">{seleccionado.rut ? `${seleccionado.rut} · ` : ""}{seleccionado.rol} · {seleccionado.area} · Casillero {seleccionado.casillero}</p>
                </div>
                <TurnoChip turno={seleccionado.turnoActual} />
                <EstadoJefeBadge estado={seleccionado.estadoJefe} />
              </div>
              {resumenAsistencia && (
                <div className="flex gap-2 mt-4 flex-wrap">
                  <span className="text-xs font-medium rounded-full px-2.5 py-1 bg-emerald-100 text-emerald-700">Asistió: {resumenAsistencia.A}</span>
                  <span className="text-xs font-medium rounded-full px-2.5 py-1 bg-red-100 text-red-700">Faltas: {resumenAsistencia.F}</span>
                  <span className="text-xs font-medium rounded-full px-2.5 py-1 bg-blue-100 text-blue-700">Licencias: {resumenAsistencia.L}</span>
                  <span className="text-xs font-medium rounded-full px-2.5 py-1 bg-amber-100 text-amber-700">Vacaciones: {resumenAsistencia.V}</span>
                </div>
              )}
            </Card>

            <Card>
              <p className="text-sm font-medium text-slate-900 mb-4">Historial completo</p>
              {timeline.length === 0 && <p className="text-sm text-slate-400 text-center py-8">Sin eventos registrados para esta persona.</p>}
              <div className="space-y-3 max-h-[28rem] overflow-y-auto pr-1">
                {timeline.map((ev, i) => (
                  <div key={i} className="flex gap-3">
                    <div className={`w-8 h-8 rounded-full ${ev.bg} ${ev.color} flex items-center justify-center shrink-0`}>
                      <ev.icon size={15} />
                    </div>
                    <div className="min-w-0 flex-1 pb-3 border-b border-slate-50 last:border-0">
                      <div className="flex items-center justify-between gap-2">
                        <p className="text-sm font-medium text-slate-900">{ev.titulo}</p>
                        <span className="text-xs text-slate-400 shrink-0">{fmtFecha(ev.fecha)}</span>
                      </div>
                      {ev.detalle && <p className="text-xs text-slate-500 mt-0.5">{ev.detalle}</p>}
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// APP PRINCIPAL
// ---------------------------------------------------------------------------
function AsistenciaApp() {
  const [colaboradores, saveColaboradores, loadingColab, errorColab, saveColaboradoresUpsert, _colabAgregarNoUsado, setColaboradoresLocal] = useSharedList("asist-colaboradores");
  const [registros, saveRegistros, loadingReg, errorReg, saveRegistrosUpsert, _regAgregarNoUsado, setRegistrosLocal] = useSharedList("asist-registros");
  const [historialTurnos, saveHistorial, loadingHist, errorHist, saveHistorialUpsert, saveHistorialAgregar, setHistorialTurnosLocal] = useSharedList("asist-turnos-historial");
  const [historialEstado, saveHistorialEstado, loadingHistEstado, errorHistEstado, saveHistorialEstadoUpsert, saveHistorialEstadoAgregar, setHistorialEstadoLocal] = useSharedList("asist-historial-estado");
  const [notas, saveNotas, loadingNotas, errorNotas, saveNotasUpsert, saveNotasAgregar] = useSharedList("asist-notas");
  const errorConexion = errorColab || errorReg || errorHist || errorHistEstado || errorNotas;

  const [vista, setVista] = useState("asistencia");
  const [modoJefe, setModoJefe] = useState(false);
  const [mostrarLogin, setMostrarLogin] = useState(false);
  const [colabHistorial, setColabHistorial] = useState(null);

  const [turnoSel, setTurnoSel] = useState("T1");
  const [fechaSel, setFechaSel] = useState(today());
  const [areaFiltro, setAreaFiltro] = useState("Todos");
  const [estadoLocal, setEstadoLocal] = useState({});
  const [guardando, setGuardando] = useState(false);
  const [toast, setToast] = useState(null);

  const loading = loadingColab || loadingReg || loadingHist || loadingHistEstado || loadingNotas;

  // Nota: ya no se auto-siembran colaboradores de muestra. La lista empieza vacía
  // y se puebla importando el CSV real desde Estado laboral.

  const claveTurno = `${fechaSel}|${turnoSel}`;

  useEffect(() => {
    const map = {};
    registros.filter(r => r.clave === claveTurno).forEach(r => {
      map[r.colabId] = { estado: r.estado, obs: r.obs || "" };
    });
    setEstadoLocal(map);
  }, [claveTurno, loadingReg]);

  function mostrarToast(msg, kind = "ok") {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 4500);
  }

  // Conserva máximo 3 observaciones (las más recientes) por colaborador; el resto se vacía.
  // Igual que antes, pero además devuelve qué índices quedaron modificados
  // (a los que se les vació la observación por pasar el límite de 3).
  function limitarObservaciones(regs) {
    const porPersona = {};
    regs.forEach((r, idx) => {
      if (r.obs && r.obs.trim()) {
        (porPersona[r.colabId] = porPersona[r.colabId] || []).push({ idx, fecha: r.fecha });
      }
    });
    const copia = regs.map(r => ({ ...r }));
    const idxModificados = new Set();
    Object.values(porPersona).forEach(lista => {
      if (lista.length > 3) {
        lista.sort((a, b) => b.fecha.localeCompare(a.fecha));
        lista.slice(3).forEach(item => { copia[item.idx].obs = ""; idxModificados.add(item.idx); });
      }
    });
    return { combinados: copia, idxModificados };
  }

  async function guardarAsistencia() {
    setGuardando(true);
    const otros = registros.filter(r => r.clave !== claveTurno);
    // Migración automática: si algún registro antiguo no tiene "id" (viene de
    // antes de esta optimización), se le asigna aquí. No requiere acción del usuario.
    const necesitaMigracion = otros.some(r => !r.id);
    const otrosConId = otros.map(r => r.id ? r : { ...r, id: `${r.clave}_${r.colabId}` });

    const nuevos = Object.entries(estadoLocal)
      .filter(([, v]) => v?.estado)
      .map(([colabId, v]) => {
        const colabIdNum = Number(colabId);
        return {
          id: `${claveTurno}_${colabIdNum}`,
          clave: claveTurno,
          colabId: colabIdNum,
          estado: v.estado,
          obs: v.obs || "",
          fecha: fechaSel,
          turno: turnoSel,
        };
      });

    const { combinados, idxModificados } = limitarObservaciones([...otrosConId, ...nuevos]);

    let ok = false;
    if (necesitaMigracion) {
      // Primera vez: hay que escribir todo una vez para que todos los
      // registros queden con "id". De ahí en adelante ya no hace falta.
      ok = await saveRegistros(combinados);
    } else {
      // Solo se envían los registros que realmente cambiaron: los de este
      // turno más los que perdieron su observación por el límite de 3.
      const idsNuevos = new Set(nuevos.map(r => r.id));
      const modificados = combinados.filter((r, idx) => idxModificados.has(idx) || idsNuevos.has(r.id));
      setRegistrosLocal(combinados);
      try {
        const data = await backendUpsert("asist-registros", modificados, "id");
        ok = !!data?.ok;
      } catch (e) { ok = false; }
    }

    setGuardando(false);
    if (ok) {
      // Se limpian las observaciones ya guardadas para empezar una nueva la
      // próxima vez; el estado A/F/L/V marcado se mantiene tal cual.
      setEstadoLocal(prev => {
        const next = {};
        Object.entries(prev).forEach(([colabId, v]) => { next[colabId] = { ...v, obs: "" }; });
        return next;
      });
    }
    mostrarToast(ok ? "Asistencia guardada correctamente" : "Error al guardar la asistencia", ok ? "ok" : "error");
  }

  function salirModoJefe() {
    setModoJefe(false);
    if (vista !== "asistencia") setVista("asistencia");
  }

  const titulos = {
    asistencia: "Asistencia del turno",
    indicadores: "Indicadores",
    estadoLaboral: "Estado laboral",
    historial: "Historial por persona",
  };

  if (loading) {
    return (
      <div className="min-h-screen bg-slate-50 flex items-center justify-center">
        <Loader />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 flex">
      <Sidebar
        vista={vista}
        setVista={setVista}
        modoJefe={modoJefe}
        onLogin={() => setMostrarLogin(true)}
        onLogout={salirModoJefe}
      />

      <div className="flex-1 min-w-0">
        <header className="bg-white border-b border-slate-200 px-8 py-5">
          <h1 className="text-lg font-semibold text-slate-900">{titulos[vista]}</h1>
        </header>

        {errorConexion && (
          <div className="bg-red-50 border-b border-red-200 px-8 py-2.5 text-xs text-red-700">
            <strong>Error de conexión con la base de datos:</strong> {errorConexion}
          </div>
        )}

        <main className="p-8 max-w-6xl">
          {vista === "asistencia" && (
            <PantallaAsistencia
              colaboradores={colaboradores}
              registros={registros}
              claveTurno={claveTurno}
              estadoLocal={estadoLocal}
              setEstadoLocal={setEstadoLocal}
              turnoSel={turnoSel}
              setTurnoSel={setTurnoSel}
              fechaSel={fechaSel}
              setFechaSel={setFechaSel}
              areaFiltro={areaFiltro}
              setAreaFiltro={setAreaFiltro}
              onGuardar={guardarAsistencia}
              guardando={guardando}
              modoJefe={modoJefe}
              onIrHistorialPersona={setColabHistorial}
            />
          )}

          {vista === "indicadores" && modoJefe && (
            <PantallaIndicadores colaboradores={colaboradores} registros={registros} />
          )}

          {vista === "estadoLaboral" && modoJefe && (
            <PantallaEstadoLaboral
              colaboradores={colaboradores}
              saveColaboradores={saveColaboradores}
              saveColaboradoresUpsert={saveColaboradoresUpsert}
              setColaboradoresLocal={setColaboradoresLocal}
              historialEstado={historialEstado}
              saveHistorialEstado={saveHistorialEstado}
              saveHistorialEstadoAgregar={saveHistorialEstadoAgregar}
              setHistorialEstadoLocal={setHistorialEstadoLocal}
              historialTurnos={historialTurnos}
              saveHistorial={saveHistorial}
              saveHistorialAgregar={saveHistorialAgregar}
              setHistorialTurnosLocal={setHistorialTurnosLocal}
              notas={notas}
              saveNotas={saveNotas}
              onToast={mostrarToast}
              onIrHistorialPersona={setColabHistorial}
            />
          )}

          {vista === "historial" && modoJefe && (
            <PantallaHistorialPorPersona
              colaboradores={colaboradores}
              registros={registros}
              historialTurnos={historialTurnos}
              historialEstado={historialEstado}
              notas={notas}
            />
          )}
        </main>
      </div>

      {colabHistorial && (
        <PanelHistorialTurno
          colaborador={colabHistorial}
          colaboradores={colaboradores}
          saveColaboradores={saveColaboradores}
          saveColaboradoresUpsert={saveColaboradoresUpsert}
          setColaboradoresLocal={setColaboradoresLocal}
          historial={historialTurnos}
          saveHistorial={saveHistorial}
          saveHistorialAgregar={saveHistorialAgregar}
          setHistorialTurnosLocal={setHistorialTurnosLocal}
          onToast={mostrarToast}
          onClose={() => setColabHistorial(null)}
        />
      )}

      {mostrarLogin && (
        <LoginJefeModal
          onClose={() => setMostrarLogin(false)}
          onSuccess={() => { setModoJefe(true); setMostrarLogin(false); mostrarToast("Modo Jefe activado"); }}
        />
      )}

      <ToastHost toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AsistenciaApp />);
</script>
